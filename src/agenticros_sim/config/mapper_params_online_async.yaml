slam_toolbox:
  ros__parameters:
    use_sim_time: false
    # TF settings
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    
    # Map settings
    map_update_interval: 1.0
    resolution: 0.05
    
    # SLAM Toolbox specific for async
    mode: mapping
    
    # Essential for small robots
    max_laser_range: 3.5
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.05
    
    # Tuning - rely heavily on scan matching
    scan_match_tolerance: 0.05
    transform_publish_period: 0.02
    
    # Loop closure
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    
    # Optimization
    stochastic_sampling_multiplier: 1.0
