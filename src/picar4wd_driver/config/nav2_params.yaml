# Nav2 Navigation Stack Configuration for Picar Robot
# Placeholder file - customize for your robot

# Navigation parameters for NVIDIA AGX Orin + RPLidar A1
# Use with: ros2 launch nav2_bringup navigation_launch.py params_file:=path/to/this/file.yaml

# --- Smoothing & Filtering ---
smooth_gradient: false
smoother_plugins: ['nav2_robot_perceptor_smoother/RobotStateSmoother']
use_sim_time: true

# --- Robot Parameters ---
robot_base_frame: 'base_link'
global_frame: 'odom'
robot_radius: 0.35
robot_height: 0.50
max_vel_x: 0.5
max_vel_theta: 1.0

# --- Costmap Parameters ---
robot_scan_topic: '/scan'
robot_base_scan_topic: '/base_scan'

# --- Planner Configuration ---
planner_server:
  plugin: 'nav2_bt_navigator.BTNavigator'
  # Use BT navigator with specified planner

# --- Controller Configuration ---
controller_server:
  plugin: 'nav2_controller.BaseController'
  # Differential drive controller

# --- Filter Configuration ---
smoother:
  plugin: 'nav2_robot_perceptor_smoother.RobotStateSmoother'

# --- Behavior Configuration ---
bt_navigator:
  plugin: 'nav2_bt_navitor.BTNavigator'
  # Behavior tree for navigation

# --- Global Costmap ---
global_costmap:
  update_frequency: 5.0
  publish_frequency: 2.0
  static_map: false
  width: 50.0
  height: 50.0
  resolution: 0.05
  robot_radius: 0.35

# --- Local Costmap ---
local_costmap:
  update_frequency: 5.0
  publish_frequency: 2.0
  static_map: false
  width: 5.0
  height: 5.0
  resolution: 0.05
  robot_radius: 0.35
  use_geometry: true

# --- Timeout Configuration ---
recovery_behavior_timeout: 0.0
smoothening_time_constant: 0.5
db_scan_from_particles: false
db_scan_max_range: 3.5
db_scan_min_range: 0.15
db_scan_partitions: 5
db_scan_angle_width: 0.5